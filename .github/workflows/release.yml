name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIPROBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minprobe-release.jks"
      - name: Build and test signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/minprobe-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.MINIPROBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIPROBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIPROBE_KEY_PASSWORD }}
        run: bash gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/MinProbe-${GITHUB_REF_NAME#v}-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: miniprobe-release-apk
          path: app/build/outputs/apk/release/MinProbe-*-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/MinProbe-*-release.apk
